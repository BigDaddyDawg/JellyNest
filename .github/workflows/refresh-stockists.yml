name: Refresh Stockists

on:
  schedule:
    # Weekly — Monday 14:00 UTC
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh Jellycat stockists
        run: python scripts/refresh_stockists.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stockists.json
          if git diff --staged --quiet; then
            echo "No stockist changes"
          else
            git commit -m "Refresh Jellycat stockist directory"
            git push
          fi
